[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.2.0"
description = "Local-first workbench that compiles one Python-authored workflow to Argo and Airflow, with per-target capability diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FlowForge Contributors" }]
keywords = ["workflow", "orchestration", "pipeline", "dag", "argo", "airflow", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pip-audit>=2.6"]

[project.scripts]
ff = "flowforge.cli:main"

[project.urls]
Documentation = "https://github.com/nikhilsontakke/flowforge/tree/main/docs"

[tool.setuptools]
packages = ["flowforge", "flowforge.compilers"]

[tool.setuptools.package-data]
flowforge = ["webui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
