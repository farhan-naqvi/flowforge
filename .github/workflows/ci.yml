name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Only real, currently-passing commands run here. Quarantined code under
# experimental/ is intentionally excluded (it does not build).
jobs:
  python:
    name: flowforge (python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Compile examples (smoke)
        run: |
          ff validate examples/simple_etl.py
          ff compile examples/simple_etl.py argo -o /tmp/etl.argo.yaml
          ff compile examples/simple_etl.py airflow -o /tmp/etl.airflow.py
          python -c "import yaml; yaml.safe_load(open('/tmp/etl.argo.yaml'))"
          python -m py_compile /tmp/etl.airflow.py

  covenant:
    name: covenant (contract-first pipeline)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install covenant-transforms + covenant
        run: |
          pip install -e covenant-transforms
          pip install -e covenant
      - name: Primitive library tests
        run: pytest covenant-transforms/tests -q
      - name: Trust-core tests
        run: pytest covenant/tests -q
      - name: End-to-end demo (incl. failure case)
        run: covenant demo

  security:
    name: python security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit || true  # advisory: report, do not block the build

  go-ir:
    name: ir (go schema-of-record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build & test ir
        working-directory: ir
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: govulncheck (advisory)
        working-directory: ir
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./... || true
